version: "3.8"

services:
  elephantine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elephantine-memory
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8765
      - ELEPHANTINE_STORAGE_DIR=/app/data
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
