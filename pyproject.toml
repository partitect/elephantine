[project]
name = "memagent"
version = "0.1.0"
description = "Production-grade, CPU-Native, Local-First Cognitive AI Memory Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "aiosqlite>=0.20.0",
    "lancedb>=0.13.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
