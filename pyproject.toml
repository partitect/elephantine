[project]
name = "elephantine"
version = "0.3.5"
description = "Zero-GPU, Local-First, CPU-Native Memory Layer for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Partitect Team", email = "contact@partitect.com" }
]
keywords = [
    "ai",
    "agent-memory",
    "mcp",
    "model-context-protocol",
    "local-first",
    "vector-database",
    "cursor",
    "claude-desktop",
    "cpu-native",
    "zero-gpu"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "aiosqlite>=0.20.0",
    "lancedb>=0.13.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0"
]

[project.scripts]
elephantine = "memagent.cli:main"
memagent = "memagent.cli:main"

[project.urls]
Homepage = "https://github.com/partitect/elephantine"
Repository = "https://github.com/partitect/elephantine"
Issues = "https://github.com/partitect/elephantine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "build>=1.2.0",
    "twine>=5.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memagent"]

